name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-e-core:
    name: Tipos, lint e testes (core + app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Código compartilhado da Edge Function em dia
        run: npm run check:shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:core
      - run: npm run test:app
      - name: Typecheck da Edge Function (Deno)
        run: npm run typecheck:functions
      - name: Servidor de desenvolvimento Web abre sem erro
        working-directory: apps/mobile
        env:
          CI: 1
          EXPO_OFFLINE: 1
          EXPO_PUBLIC_SUPABASE_URL: http://localhost:54321
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci
        run: |
          npx expo start --web --port 8081 > expo.log 2>&1 &
          code=000
          for i in $(seq 1 60); do
            code=$(curl -s -o page.html -w "%{http_code}" http://localhost:8081/sign-in || true)
            [ "$code" != "000" ] && break
            sleep 3
          done
          tail -n 30 expo.log
          test "$code" = "200"

  banco:
    name: Migrations e regras de acesso (RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:54329/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:db
