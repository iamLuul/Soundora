# Cria conta com e-mail e senha, sai e entra de novo com a mesma senha.
# Rodar: maestro test apps/mobile/.maestro/03-login-com-senha.yaml -e EMAIL=teste3@soundora.dev -e PASSWORD=senha-forte-123
# (com enable_confirmations = false no supabase/config.toml, a conta já nasce logada)
appId: app.soundora
---
- launchApp:
    clearState: true
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-up"
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 10000
# Sai do app sem terminar o cadastro e entra de novo com a senha
- launchApp:
    clearState: true
- tapOn:
    id: "email-input"
- inputText: ${EMAIL}
- tapOn:
    id: "password-input"
- inputText: ${PASSWORD}
- tapOn:
    id: "sign-in"
- extendedWaitUntil:
    visible:
      id: "username-input"
    timeout: 10000
